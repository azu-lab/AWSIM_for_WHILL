# Search space of the vehicle parameter optimization (Optuna TPE).
#
# Ranges are the ones recorded in the Optuna storages of the studies that produced
# config/vehicle/whill_model_cr_optimized_4scenario_v2.yaml (4scenario_v2.db, the default) and
# whill_model_cr_optimized_3scenario_v2.yaml (3scenario_v2.db), identical in both
# (trial_params.distribution_json), i.e. the search space of soturon commit 43b63ef.
# The defaults are the initial values of Table II of the paper (rolling_resistance 0.002; the
# trial #0 of both studies used 0.02).
#
# NOTE: DEFAULT_PARAMETER_RANGES in optimizer/whill_optimizer/optimizer.py (soturon
# e91b33f, kept unchanged) differs only in the center of mass:
#   com_offset_x: [-0.2, 0.2]  default 0.0
#   com_offset_y: [ 0.1, 0.6]  default 0.3
# It is used only when --search-space '' is given.
#
#   low / high : search range
#   default    : value of the first trial (enqueued) and of disabled parameters
#   log        : search in log scale
#   enabled    : false = keep `default` and do not search
#
# Names are the keys of OptimizerBridge.ParameterSet (Unity side), which maps
# them to AccelVehicle fields, e.g. wheel_kp -> AccelVehicle._wheelKp.
parameters:
  # Lateral resistance of the drive wheels / front casters
  skidding_cancel_rate:      {low: 0.0,  high: 50.0, default: 1.0}
  front_wheel_skidding_rate: {low: 0.0,  high: 10.0, default: 0.1}
  forward_slip_multiplier:   {low: 0.5,  high: 1.0,  default: 1.0}
  # Per-wheel speed PID
  wheel_kp:                  {low: 0.0,  high: 30.0, default: 10.0}
  wheel_ki:                  {low: 0.0,  high: 1.0,  default: 0.0}
  wheel_kd:                  {low: 0.0,  high: 2.0,  default: 0.0}
  wheel_integral_clamp:      {low: 0.1,  high: 3.0,  default: 0.5}
  # Drag
  air_drag:                  {low: 0.1,  high: 1.5,  default: 0.2}
  rolling_resistance:        {low: 0.0,  high: 0.05, default: 0.002}   # paper Table II (soturon: 0.02)
  frontal_area:              {low: 0.4,  high: 1.2,  default: 0.8}
  # Center of mass in the vehicle frame (Unity axes: x = right, y = up, z = forward) [m]
  com_offset_x:              {low: -0.25, high: 0.25, default: 0.0}
  com_offset_y:              {low: -0.3, high: 0.3,  default: 0.0}
  com_offset_z:              {low: -0.3, high: 0.3,  default: 0.0}
