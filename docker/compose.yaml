# Build the images (ros2 first, dreamer is built on top of it):
#   docker compose -f docker/compose.yaml build ros2
#   docker compose -f docker/compose.yaml build dreamer
services:
  ros2:
    image: awsim-for-whill/ros2:latest
    build:
      context: ..
      dockerfile: docker/ros2/Dockerfile
  dreamer:
    image: awsim-for-whill/dreamer:latest
    depends_on: [ros2]
    build:
      context: ..
      dockerfile: docker/dreamer/Dockerfile
      args:
        BASE_IMAGE: awsim-for-whill/ros2:latest
