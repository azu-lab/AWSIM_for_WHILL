# Environment of the "original" task (AWSIMWheelchairEnv).
# Values are the defaults of rl/awsim_dreamerv3/config.py; the reward coefficients are
# the numbers that were hard-coded in env.py at soturon/optimize e91b33f.
task: original

action:
  max_linear_vel: 1.0        # [m/s]   forward only
  max_angular_vel: 1.0       # [rad/s]

episode:
  timeout_sec: 15.0
  step_duration: 0.1

goal:
  radius: 0.75
  # Used only when /awsim/goal_position has not been received:
  # goal = initial position + this distance along ROS x
  fallback_distance_ros_x: 5.0

reward:   # r = goal + collision + progress_scale*(d_prev - d) + time - steering_change*|da1|
  goal: 100.0
  collision: -50.0
  progress_scale: 30.0
  time: -0.05
  steering_change: 1.0
