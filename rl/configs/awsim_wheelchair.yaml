# DreamerV3 Configuration for AWSIM Wheelchair Task

defaults:

  # Task
  task: awsim_wheelchair
  
  # Environment settings
  env:
    awsim:
      # Image settings
      size: [64, 64]
      # Episode settings
      time_limit: 150  # 15 seconds * 10 Hz = 150 steps
      
  # Replay buffer
  replay:
    size: 1000000
    online: True
    
  # Training
  batch_size: 16
  batch_length: 64
  
  # Model architecture
  agent:
    # Encoder (Image) - Key: enc.simple
    enc:
      simple:
        depth: 32
        # cnn_keys logic is handled by DreamerV3 based on observation keys
      
    # Decoder (Image) - Key: dec.simple
    dec:
      simple:
        depth: 32
      
    # World model (RSSM) - Key: dyn.rssm
    dyn:
      rssm:
        deter: 512
        stoch: 64
        classes: 32
      
    # Actor (Policy) - Key: policy
    policy:
      layers: 4
      units: 256
      
    # Critic (Value) - Key: value
    value:
      layers: 4
      units: 256
      
  # Optimization
  opt:
    actor_lr: 3e-5
    critic_lr: 3e-5
    model_lr: 1e-4
    
  # Exploration
  expl:
    expl_amount: 0.0
    
  # Logging
  logger:
    outputs: [tensorboard, jsonl]
    
  # Run settings
  run:
    steps: 1e6
    log_every: 1e2
    report_every: 1e4    # TensorBoard IMAGES tab (World Model reconstructions)
    save_every: 1e4
    eval_every: 1e3
    train_ratio: 1.0
    
  # JAX settings
  jax:
    platform: cuda
    compute_dtype: float16
