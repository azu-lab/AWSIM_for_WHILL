# DreamerV3 Configuration for AWSIM Obstacle Avoidance Task
# ダンボール回避前進タスク用
#
# 使い方:
#   python scripts/train.py --task obstacle_avoidance --config configs/awsim_obstacle_avoidance.yaml

defaults:

  # Task
  task: awsim_obstacle_avoidance
  
  # Environment settings
  env:
    awsim:
      # Image settings
      size: [64, 64]
      # Episode settings
      time_limit: 300  # 30 seconds * 10 Hz = 300 steps
      
  # Replay buffer
  replay:
    size: 1000000
    online: True
    
  # Training
  batch_size: 16
  batch_length: 64
  
  # Model architecture
  agent:
    # Encoder (Image)
    enc:
      simple:
        depth: 32
      
    # Decoder (Image)
    dec:
      simple:
        depth: 32
      
    # World model (RSSM)
    dyn:
      rssm:
        deter: 512
        stoch: 64
        classes: 32
      
    # Actor (Policy)
    policy:
      layers: 4
      units: 256
      
    # Critic (Value)
    value:
      layers: 4
      units: 256
      
  # Optimization
  opt:
    actor_lr: 3e-5
    critic_lr: 3e-5
    model_lr: 1e-4
    
  # Exploration
  expl:
    expl_amount: 0.0
    
  # Logging
  logger:
    outputs: [tensorboard, jsonl]
    
  # Run settings
  run:
    steps: 1e6
    log_every: 1e2
    report_every: 1e4
    save_every: 5e3
    eval_every: 1e3
    train_ratio: 1.0
    
  # JAX settings
  jax:
    platform: cuda
    compute_dtype: float16
